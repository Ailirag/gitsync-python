name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Настроить Python
        run: uv venv --python ${{ matrix.python-version }} .venv
      - name: Установить пакет и зависимости разработки
        run: uv pip install --python .venv -e ".[dev]"
      - name: Настроить git для тестов
        run: |
          git config --global user.email "ci@example.org"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Статические проверки
        run: uv run --python .venv ruff check src tests
      - name: Тесты
        run: uv run --python .venv pytest -q
      - name: Сборка пакета
        run: uv build --out-dir dist .

  # Образ ЯДРА: Python + Git + колесо пакета, без платформы 1С.
  # Приватный образ с платформой (docker/Dockerfile.native) здесь не собирается
  # и собираться не может: его дистрибутив несвободен и в CI не попадает.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать образ ядра
        run: docker build -f docker/Dockerfile.core --target core -t gitsync-py:core .
      - name: Собрать цель для тестов
        run: docker build -f docker/Dockerfile.core --target test -t gitsync-py:test .
      - name: Тесты внутри контейнера
        run: |
          docker run --rm -e TZ=Europe/Moscow gitsync-py:test sh -c '
            git config --global user.email "ci@example.org";
            git config --global user.name "CI";
            git config --global init.defaultBranch main;
            python -m pytest -q -rs'
      - name: Сценарии пользователя на установленном колесе
        run: |
          mkdir -p /tmp/acceptance
          cp docker/acceptance/*.py /tmp/acceptance/
          cp -r tests/support /tmp/acceptance/support
          docker run --rm -e TZ=Europe/Moscow -v /tmp/acceptance:/acceptance:ro \
            --entrypoint python gitsync-py:core /acceptance/core_acceptance.py /tmp/приёмка
      - name: В образе выполнения нет ни тестов, ни дистрибутивов
        run: |
          docker run --rm --entrypoint sh gitsync-py:core -c '
            found=$(find / -xdev \( -name "test_*.py" -o -name "*.deb" -o -name "*.run" \
                                    -o -name "*.lic" \) 2>/dev/null)
            if [ -n "$found" ]; then echo "НАЙДЕНО ЛИШНЕЕ:"; echo "$found"; exit 1; fi
            echo "образ чист"'
      - name: Проверить схему compose
        run: |
          docker compose --env-file docker/env.example -f docker/compose.yaml config >/dev/null
